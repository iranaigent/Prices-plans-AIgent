<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIgent | ارائه خدمات دیجیتال برای کسب‌وکارها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg0:#020a10; --bg1:#061b26; --petrol:#0b3340; --petrol2:#0f4656;
  --gold1:#f7e9b9; --gold2:#d9b45f; --gold3:#a8812f; --goldDim:rgba(217,180,95,.55);
  --ink:#eaf0f2; --mute:#93aab3; --faint:rgba(217,180,95,.16);
  --font:'Vazirmatn','Vazir','IRANSans','Tahoma','Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#010609;overflow:hidden;font-family:var(--font);color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(1300px 800px at 85% 5%, rgba(18,86,104,.45), transparent 60%),
   radial-gradient(1000px 700px at 5% 105%, rgba(217,180,95,.10), transparent 60%),
   linear-gradient(160deg,#08222e 0%,#041620 50%,#020a10 100%);}
#dust{position:absolute;inset:0;z-index:0;pointer-events:none}
#grid{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(217,180,95,.20) 1.2px, transparent 1.6px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(900px 600px at 70% 40%, #000, transparent 75%);mask-image:radial-gradient(900px 600px at 70% 40%, #000, transparent 75%)}
.slide{position:absolute;inset:0;z-index:1;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s .6s;padding:70px 96px}
.slide.active{opacity:1;visibility:visible;transition:opacity .6s ease}
.slide:not(.active):not(.leaving) *{animation:none!important}

/* ---------- gold material ---------- */
.gold{background:linear-gradient(100deg,#f7e9b9 0%,#d9b45f 35%,#fff3cb 52%,#b8913a 75%,#e9c97a 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
.box{position:relative;border:1.5px solid transparent;border-radius:24px;
  background:linear-gradient(rgba(7,30,41,.88),rgba(5,22,31,.9)) padding-box,
             linear-gradient(135deg,#f7e9b9 0%,#a8812f 38%,#e9c97a 62%,#8a6a22 100%) border-box;
  box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 0 40px rgba(217,180,95,.05)}
.box.soft{background:linear-gradient(rgba(8,36,48,.7),rgba(5,22,31,.7)) padding-box,linear-gradient(135deg,rgba(247,233,185,.8),rgba(168,129,47,.5) 40%,rgba(233,201,122,.7)) border-box}
.dustline{height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.kicker{font-size:26px;font-weight:500;letter-spacing:.02em;color:var(--gold2)}
.h1{font-size:92px;font-weight:900;line-height:1.15}
.h2{font-size:58px;font-weight:800;line-height:1.25}
.lead{font-size:30px;line-height:1.9;color:#c5d3d8;font-weight:400}

/* ---------- reveal ---------- */
.rv{opacity:0}
.active .rv,.leaving .rv{animation:rv .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*1ms)}
.rvx{opacity:0}
.active .rvx,.leaving .rvx{animation:rvx .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*1ms)}
@keyframes rv{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes rvx{from{opacity:0;transform:translateX(-60px) scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-220% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinrev{to{transform:rotate(-360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
@keyframes draw{0%{stroke-dashoffset:100}55%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
@keyframes drawOnce{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg);opacity:0}60%{transform:scale(1.25) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes grow{0%{transform:scaleY(0)}60%,100%{transform:scaleY(1)}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}
@keyframes road{to{stroke-dashoffset:-120}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sweep{from{transform:translateX(-500px) rotate(20deg)}to{transform:translateX(700px) rotate(20deg)}}
@keyframes ringout{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2);opacity:0}}
@keyframes lineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes popin{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes travel{0%{left:100%}100%{left:0%}}
.svgb{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 24s linear infinite}
.spinrev{animation:spinrev 32s linear infinite}
.floaty{animation:float 5s ease-in-out infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.draw{stroke-dasharray:100;animation:draw 4.2s ease-in-out infinite}
.flow{stroke-dasharray:6 94;animation:flow 2.6s linear infinite}
.tw{animation:twinkle 3s ease-in-out infinite}

/* ---------- logo / small ---------- */
.foot{position:absolute;left:96px;bottom:26px;display:flex;align-items:center;gap:12px;font-size:19px;color:var(--mute);direction:ltr;z-index:2}
.foot b{color:var(--gold2);font-weight:700;letter-spacing:.06em}
.foot svg{width:30px;height:30px}

/* ---------- cover ---------- */
.cover{display:grid;grid-template-columns:1fr 760px;align-items:center;gap:20px}
.cover .txt{padding-inline-end:20px}
.cover .brand{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.cover .brand .nm{font-size:44px;font-weight:800;direction:ltr;letter-spacing:.08em}
.cover h1{font-size:104px;font-weight:900;line-height:1.2;margin-bottom:26px}
.cover .sub{font-size:34px;color:#c5d3d8;line-height:1.9;max-width:900px}
.cover .tags{display:flex;gap:16px;margin-top:44px;flex-wrap:wrap}
.chip{padding:12px 26px;border-radius:999px;font-size:24px;color:var(--gold1);border:1.5px solid rgba(217,180,95,.5);background:rgba(217,180,95,.07)}
.scene{width:100%;height:100%}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:1fr 760px;gap:70px;align-items:center}
.about .pts{display:flex;flex-direction:column;gap:22px;margin-top:40px}
.pt{display:flex;gap:22px;padding:22px 28px;align-items:flex-start}
.pt .dot{flex:0 0 18px;height:18px;margin-top:14px;transform:rotate(45deg);background:linear-gradient(135deg,#f7e9b9,#a8812f);border-radius:3px}
.pt h4{font-size:30px;font-weight:700;color:var(--gold1);margin-bottom:6px}
.pt p{font-size:25px;color:#b8c8ce;line-height:1.8}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.stat{padding:42px 20px;text-align:center}
.stat .n{font-size:110px;font-weight:900;line-height:1;direction:ltr;display:inline-block}
.stat .l{font-size:26px;color:#b8c8ce;margin-top:16px;line-height:1.6}

/* ---------- services ---------- */
.svc-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:46px}
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.svc{padding:34px 30px;min-height:290px;transition:transform .35s,box-shadow .35s}
.svc:hover{transform:translateY(-8px);box-shadow:0 30px 70px rgba(217,180,95,.15)}
.svc .ic{width:84px;height:84px;margin-bottom:22px}
.svc .ic svg{width:100%;height:100%}
.svc h3{font-size:32px;font-weight:800;margin-bottom:10px;color:var(--gold1)}
.svc p{font-size:24px;color:#b8c8ce;line-height:1.75}
.svc.last{grid-column:span 1;background:linear-gradient(rgba(12,52,66,.92),rgba(5,22,31,.92)) padding-box,linear-gradient(135deg,#f7e9b9,#a8812f 40%,#e9c97a) border-box}
.svc .num{position:absolute;top:22px;left:26px;font-size:22px;color:var(--goldDim);direction:ltr;font-weight:500}
.ico{fill:none;stroke:url(#gg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .ico{animation:float 6s ease-in-out infinite}

/* ---------- process ---------- */
.proc{display:flex;flex-direction:column;justify-content:center;height:100%}
.tl{position:relative;margin-top:100px;padding-top:70px}
.tl .rail{position:absolute;right:100px;left:100px;top:104px;height:3px;background:linear-gradient(90deg,transparent,var(--gold2),var(--gold1),var(--gold2),transparent);transform-origin:right;
  animation:none}
.active .tl .rail{animation:lineIn 1.6s cubic-bezier(.6,0,.2,1) .3s both}
.tl .runner{position:absolute;top:92px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle,#fff3cb,#d9b45f 60%,transparent 72%);box-shadow:0 0 30px 8px rgba(247,233,185,.5);left:100%;opacity:0}
.active .tl .runner{opacity:1;animation:travel 5s cubic-bezier(.5,0,.5,1) 2s infinite}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;position:relative}
.step{text-align:center;display:flex;flex-direction:column}
.step .bx{flex:1}
.step .c{width:96px;height:96px;margin:-0px auto 30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:var(--gold1);position:relative;top:-47px;margin-bottom:-17px;
  background:linear-gradient(#06222d,#06222d) padding-box,linear-gradient(135deg,#f7e9b9,#a8812f 50%,#e9c97a) border-box;border:2px solid transparent;box-shadow:0 0 40px rgba(217,180,95,.25)}
.step h4{font-size:32px;font-weight:800;margin:20px 0 10px;color:var(--gold1)}
.step p{font-size:24px;color:#b8c8ce;line-height:1.7;padding:0 8px}
.step .bx{padding:22px 14px 26px;margin-top:6px}

/* ---------- industry ---------- */
.ind{display:grid;grid-template-columns:1fr 700px;gap:56px;height:100%}
.ind .main{display:flex;flex-direction:column;min-width:0}
.ind .meta{display:flex;align-items:center;gap:20px;margin-bottom:8px}
.tierbadge{padding:8px 22px;border-radius:999px;font-size:22px;font-weight:700;color:#0a1c25;background:linear-gradient(100deg,#f7e9b9,#d9b45f 60%,#b8913a)}
.ind h2{font-size:54px;font-weight:900;line-height:1.3}
.ind .tag{font-size:28px;color:#c5d3d8;margin:2px 0 14px;font-weight:500}
.lab{font-size:21px;font-weight:700;color:var(--gold2);margin-bottom:8px;letter-spacing:.03em}
.pains{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.pain{padding:10px 16px;font-size:21px;line-height:1.55;color:#d4dfe3;display:flex;gap:10px;align-items:flex-start;border-radius:16px}
.pain i{flex:0 0 11px;height:11px;margin-top:11px;border-radius:50%;background:#d9b45f;box-shadow:0 0 12px #d9b45f}
.srows{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:18px;padding:8px 20px;border-radius:18px}
.srow .si{flex:0 0 52px;height:52px;width:52px;border-radius:14px;background:rgba(217,180,95,.09);border:1px solid rgba(217,180,95,.4);padding:8px}
.srow .si svg{width:100%;height:100%}
.srow .st{font-size:22px;line-height:1.5;color:#d4dfe3}
.srow .st b{display:block;font-size:25px;color:var(--gold1);font-weight:800}
.ind .side{display:flex;flex-direction:column;gap:22px}
.scenebox{height:640px;padding:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{padding:20px 8px;text-align:center}
.kpi .v{font-size:50px;font-weight:900;line-height:1.2;direction:ltr}
.kpi .t{font-size:21px;color:#b8c8ce;margin-top:4px;line-height:1.4}
.note{font-size:18px;color:var(--mute);line-height:1.6}

/* ---------- pricing ---------- */
.price{display:flex;flex-direction:column;height:100%}
.phead{display:flex;align-items:center;gap:36px;margin-bottom:22px}
.phead .emb{width:190px;height:190px;flex:0 0 190px}
.phead .tt{flex:1}
.phead .en{direction:ltr;text-align:right;font-size:26px;letter-spacing:.3em;color:var(--gold2);font-weight:500;text-transform:uppercase}
.phead h2{font-size:68px;font-weight:900;line-height:1.2}
.phead .kicker{font-size:22px}
.phead .en{font-size:22px;line-height:1.2}
.phead .tg{font-size:30px;color:#c5d3d8;margin-top:6px}
.forbox{padding:18px 26px;font-size:24px;line-height:1.7;color:var(--gold1);max-width:520px}
.ptable{padding:6px 30px}
.prow{display:grid;grid-template-columns:420px 1fr 330px;align-items:center;gap:22px;height:74px;border-bottom:1px solid rgba(217,180,95,.18)}
.prow:last-child{border-bottom:none}
.prow .nm{display:flex;align-items:center;gap:14px;font-size:25px;font-weight:800;color:var(--gold1);line-height:1.3}
.prow .nm .pi{width:42px;height:42px;flex:0 0 42px}
.prow .nm .pi svg{width:100%;height:100%}
.prow .ds{font-size:21px;line-height:1.5;color:#c2d1d6}
.prow .pr{text-align:left;direction:rtl;display:flex;align-items:baseline;gap:10px;justify-content:flex-end}
.prow .pr .amt{font-size:34px;font-weight:900;direction:ltr;display:inline-block;min-width:150px;text-align:left}
.prow .pr small{font-size:20px;color:var(--mute);font-weight:500}
.prow .pr .frm{font-size:22px;color:var(--gold2);font-weight:700}
.pnotes{display:flex;flex-direction:column;gap:2px;margin-top:14px;font-size:19px;color:var(--mute);line-height:1.6}
.pnotes span:before{content:'◆';color:var(--gold2);margin-inline-end:10px;font-size:12px}

/* ---------- accounting / sites / webapp / bundles ---------- */
@keyframes rise{0%{opacity:0;transform:translateY(26px)}22%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(250px)}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.feat{padding:12px 18px;border-radius:18px;min-height:104px}
.feat b{display:block;font-size:24px;color:var(--gold1);font-weight:800;margin-bottom:2px}
.feat span{font-size:20px;line-height:1.55;color:#c2d1d6}
.msteps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.mstep{padding:10px 8px;text-align:center;font-size:20px;line-height:1.4;color:#d4dfe3;border-radius:16px;min-height:78px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.mstep i{font-style:normal;font-weight:900;font-size:22px;color:var(--gold2)}
.tstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tcell{padding:12px 10px;text-align:center;border-radius:18px}
.tcell small{display:block;font-size:19px;color:var(--mute)}
.tcell b{font-size:27px;font-weight:900}
.ws{display:grid;grid-template-columns:1fr 700px;gap:56px;height:100%}
.ws .main{display:flex;flex-direction:column;min-width:0}
.wtable{padding:10px 26px;margin-top:22px}
.whead,.wrow{display:grid;grid-template-columns:1fr 250px 290px;gap:18px;align-items:center}
.whead{height:62px;font-size:22px;font-weight:800;color:var(--gold2);text-align:center;border-bottom:1px solid rgba(217,180,95,.25)}
.wrow{height:108px;border-bottom:1px solid rgba(217,180,95,.15)}
.wrow:last-child{border:none}
.wrow .nm{display:flex;gap:16px;align-items:center;font-size:30px;font-weight:800;color:var(--gold1)}
.wrow .nm .pi{width:54px;height:54px;flex:0 0 54px}
.wrow .nm .pi svg{width:100%;height:100%}
.pill{border-radius:20px;padding:14px 8px;text-align:center;font-size:31px;font-weight:900;line-height:1.3}
.pill small{display:block;font-size:18px;color:var(--mute);font-weight:500}
.pill.a{background:rgba(217,180,95,.07);border:1.5px solid rgba(217,180,95,.4)}
.pill.b{background:linear-gradient(135deg,rgba(247,233,185,.22),rgba(168,129,47,.22));border:1.5px solid var(--gold2)}
.wnotes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.wnote{padding:16px 20px;font-size:21px;line-height:1.65;color:#c2d1d6;border-radius:18px}
.bigps{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0 16px}
.bigp{padding:26px 18px;text-align:center}
.bigp .nm{font-size:30px;font-weight:800;color:var(--gold1);margin-bottom:6px}
.bigp .v{font-size:62px;font-weight:900;line-height:1.25}
.bigp small{font-size:22px;color:var(--mute)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.chk{padding:12px 18px;font-size:23px;display:flex;gap:14px;align-items:center;border-radius:18px;color:#d4dfe3}
.chk:before{content:'\2713';flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f7e9b9,#a8812f);color:#0a1c25;font-weight:900}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.case{padding:12px 16px;border-radius:16px;font-size:20px;line-height:1.5;color:#c2d1d6}
.case b{display:block;font-size:24px;color:var(--gold1)}
.btable{padding:6px 28px;margin-top:6px}
.brow{display:grid;grid-template-columns:560px 1fr 330px 250px;gap:20px;align-items:center;height:80px;border-bottom:1px solid rgba(217,180,95,.18)}
.brow.head{height:54px;font-size:21px;font-weight:800;color:var(--gold2)}
.brow:last-child{border-bottom:none}
.brow .nm{font-size:24px;font-weight:800;color:var(--gold1);line-height:1.35}
.brow .nm small{display:block;font-size:18px;font-weight:600;color:var(--gold2)}
.brow .ics{display:flex;gap:8px;justify-content:flex-start}
.brow .ics svg{width:42px;height:42px;padding:6px;border:1px solid rgba(217,180,95,.4);border-radius:12px;background:rgba(217,180,95,.08)}
.brow .p1{font-size:29px;font-weight:900}
.brow .p2{font-size:23px;font-weight:700;color:var(--gold1)}
.brow small.u{font-size:17px;color:var(--mute);font-weight:500;margin-inline-start:6px}

/* ---------- QR share ---------- */
.qrs{display:grid;grid-template-columns:1fr 640px;gap:80px;align-items:center;height:100%}
.qurl{display:block;margin-top:34px;padding:18px 28px;text-decoration:none;max-width:860px}
.qurl .u{display:block;direction:ltr;text-align:left;font-size:26px;color:var(--gold1);word-break:break-all;line-height:1.5}
.qig{margin-top:26px;font-size:34px;font-weight:800;direction:ltr;text-align:right;color:var(--gold2)}
.qwrap{display:flex;justify-content:center}
.qimg{width:600px;height:600px;padding:26px;background:#fff;overflow:hidden;border-radius:30px}
.qimg{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#f7e9b9,#a8812f 50%,#e9c97a) border-box}
.qimg img{width:100%;height:100%;display:block;image-rendering:pixelated;border-radius:14px}
.qscan{position:absolute;left:26px;right:26px;top:26px;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,#d9b45f,transparent);box-shadow:0 0 24px 6px rgba(217,180,95,.55);animation:qscan 3.2s ease-in-out infinite alternate}
@keyframes qscan{from{transform:translateY(0)}to{transform:translateY(540px)}}
.qc{position:absolute;width:56px;height:56px;border:6px solid #a8812f;border-radius:6px}
.qc.a{top:12px;right:12px;border-left:0;border-bottom:0}.qc.b{top:12px;left:12px;border-right:0;border-bottom:0}
.qc.c{bottom:12px;right:12px;border-left:0;border-top:0}.qc.d{bottom:12px;left:12px;border-right:0;border-top:0}

/* ---------- contact ---------- */
.contact{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;height:100%}
.ig{position:relative;width:260px;height:260px;margin-bottom:36px}
.ig .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold2);animation:ringout 3.2s ease-out infinite}
.ig .ring:nth-child(2){animation-delay:1s}.ig .ring:nth-child(3){animation-delay:2s}
.ig svg{position:absolute;inset:50px;width:160px;height:160px}

.ctrl{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:30;opacity:.35;transition:opacity .3s;direction:ltr}
.ctrl:hover{opacity:1}
.ctrl button{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(217,180,95,.6);background:rgba(5,22,31,.75);color:var(--gold1);font-size:20px;cursor:pointer;font-family:var(--font)}
.ctrl button:hover{background:rgba(217,180,95,.2)}
.ctrl .cnt{min-width:96px;text-align:center;font-size:22px;color:var(--gold1);direction:rtl}
#hint{position:absolute;top:22px;left:30px;z-index:30;font-size:16px;color:var(--mute);opacity:.6}

</div>${foot}</section>`);
}

slides.push(`
<section class="slide"><div class="contact">
  <div class="ig rv" style="--d:100"><span class="ring"></span><span class="ring"></span><span class="ring"></span>
    <svg viewBox="0 0 48 48"><g class="ico" style="stroke-width:2.4"><rect x="7" y="7" width="34" height="34" rx="10"/><circle cx="24" cy="24" r="8"/><circle cx="34" cy="14" r="1.6" style="fill:#f7e9b9"/></g></svg></div>
  <h2 class="gold rv" style="--d:300">${D.contact.title}</h2>
  <p class="sub rv" style="--d:500">${D.contact.sub}</p>
  <div class="handle box rv" style="--d:700"><span class="gold">@${D.brand.instagram}</span></div>
  <div class="ticker rv" style="--d:1000"><div class="trk">${[...D.industries,...D.industries].map(i=>`<span class="chip">${i.title}</span>`).join('')}</div></div>
</div>${foot}</section>`);

const root = document.getElementById('slides');
root.innerHTML = slides.join('');
const els = [...root.children];
const N = els.length;

/* ============ stage scale ============ */
const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(${-960*s}px,${-540*s}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ============ counters ============ */
function runCounters(sl){
  sl.querySelectorAll('[data-count]').forEach(el=>{
    const end=+el.dataset.count, suf=el.dataset.suffix||''; const t0=performance.now();
    const f=now=>{const p=Math.min(1,(now-t0-500)/1400); const e=p<0?0:1-Math.pow(1-p,3); el.textContent=fa(Math.round(end*e))+suf; if(p<1) requestAnimationFrame(f)}; requestAnimationFrame(f);
  });
  sl.querySelectorAll('[data-price]').forEach((el,i)=>{
    const end=+el.dataset.price; const t0=performance.now(); const delay=600+i*110;
    const f=now=>{const p=Math.min(1,(now-t0-delay)/1100); const e=p<0?0:1-Math.pow(1-p,3); el.textContent=money(Math.round(end*e/1000)*1000); if(p<1) requestAnimationFrame(f); else el.textContent=money(end)}; requestAnimationFrame(f);
  });
}

/* ============ navigation ============ */
let cur = -1;
function go(i){
  i = Math.max(0, Math.min(N-1, i));
  if(i===cur) return;
  if(cur>=0){const p=els[cur]; p.classList.remove('active'); p.classList.add('leaving'); setTimeout(()=>p.classList.remove('leaving'),650);}
  cur = i; els[i].classList.add('active'); runCounters(els[i]);
  document.getElementById('cnt').textContent = fa(i+1)+' / '+fa(N);
  document.getElementById('bar').style.width = ((i+1)/N*100)+'%';
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}
}
const next=()=>go(cur+1), prev=()=>go(cur-1);
document.getElementById('next').onclick=next; document.getElementById('prev').onclick=prev;
document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
addEventListener('keydown',e=>{
  if(['ArrowLeft','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowRight','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(N-1);
  else if(e.key==='f'||e.key==='F')document.getElementById('fs').onclick();
});
let tx=null; addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)(dx<0?next:prev)();tx=null});
addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<40)return;clearTimeout(go._w);go._w=setTimeout(()=>e.deltaY>0?next():prev(),0)},{passive:true});
const h=parseInt(location.hash.slice(1));
go(isNaN(h)?0:h-1);

/* ============ gold dust ============ */
(function(){
  const c=document.getElementById('dust'),x=c.getContext('2d');const P=[];
  for(let i=0;i<110;i++)P.push({x:Math.random()*1920,y:Math.random()*1080,r:Math.random()*2.2+.4,v:Math.random()*.35+.08,a:Math.random()*Math.PI*2,s:Math.random()*.02+.005,dx:(Math.random()-.5)*.25});
  function tick(){
    x.clearRect(0,0,1920,1080);
    for(const p of P){p.y-=p.v;p.x+=p.dx+Math.sin(p.a)*.15;p.a+=p.s;if(p.y<-5){p.y=1085;p.x=Math.random()*1920}
      const al=.25+.6*Math.abs(Math.sin(p.a*3));
      const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,`rgba(247,233,185,${al})`);g.addColorStop(.35,`rgba(217,180,95,${al*.5})`);g.addColorStop(1,'rgba(217,180,95,0)');
      x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*4,0,6.283);x.fill();}
    requestAnimationFrame(tick);
  }
  tick();
})();
})();
</script>
</body>
</html>
